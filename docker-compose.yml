services:
  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    command: ["npm", "run", "start:api"]
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(Number(process.env.PORT||4000),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: development
    env_file:
      - .env
    command: ["npm", "run", "start:worker"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1,0)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
